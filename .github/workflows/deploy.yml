name: Build Website APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Prepare SDK paths for make.sh
        run: |
          # Capture the real SDK location before make.sh overrides ANDROID_HOME
          echo "SYSTEM_ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "SYSTEM_ANDROID_HOME=$ANDROID_HOME"   # verify in logs

          # make.sh checks for ./cmdline-tools in the repo root.
          # Symlink it to the system SDK's cmdline-tools/latest.
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" ./cmdline-tools

          # make.sh will later set ANDROID_HOME=$PWD/cmdline-tools.
          # Set ANDROID_SDK_ROOT to the SAME path so Gradle sees no conflict.
          echo "ANDROID_SDK_ROOT=$PWD/cmdline-tools" >> $GITHUB_ENV

          # Ensure sdkmanager is on PATH for subsequent steps.
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Force SDK path in local.properties
        run: |
          # local.properties overrides ANDROID_HOME / ANDROID_SDK_ROOT for Gradle.
          echo "sdk.dir=${{ env.SYSTEM_ANDROID_HOME }}" > local.properties
          cat local.properties   # verify

      - name: Make scripts executable
        run: chmod +x make.sh gradlew

      - name: Generate signing key
        run: ./make.sh keygen

      - name: Build APK
        run: ./make.sh build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: website-apk
          path: ./*.apk
