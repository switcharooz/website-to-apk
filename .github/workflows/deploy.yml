name: Build Website APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and set up Android Command Line Tools
        run: |
          mkdir -p cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/
          rmdir cmdline-tools/cmdline-tools
          echo "$PWD/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$PWD" >> $GITHUB_ENV

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null || true
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Make scripts executable
        run: chmod +x make.sh gradlew

      - name: Generate signing key
        run: ./make.sh keygen

      - name: Build APK
        run: ./make.sh build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: website-apk
          path: ./*.apk
