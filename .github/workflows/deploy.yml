name: Build Website APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          # Set both env vars to the same path (avoids the "different paths" error)
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          # Add sdkmanager to PATH for later steps
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Override SDK path via local.properties
        run: |
          # local.properties takes precedence over ANDROID_HOME / ANDROID_SDK_ROOT.
          # This guarantees Gradle uses the correct path regardless of env vars.
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties  # verify

      - name: Make scripts executable
        run: chmod +x make.sh gradlew

      - name: Generate signing key
        run: ./make.sh keygen

      - name: Build APK
        run: ./make.sh build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: website-apk
          path: ./*.apk
